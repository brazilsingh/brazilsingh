<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 360" width="1200" height="360" role="img" aria-labelledby="t d">
  <title id="t">Brazil Singh</title>
  <desc id="d">Builds AI agents, MCP servers, prompts, skills and automation.</desc>
  <defs>
    <clipPath id="card"><rect width="1200" height="360" rx="22"/></clipPath>
    <filter id="blur" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="70"/></filter>
    <filter id="glow" x="-20%" y="-40%" width="140%" height="180%">
      <feGaussianBlur stdDeviation="8" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <pattern id="dots" width="28" height="28" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1.3" fill="#94A3B8"/>
    </pattern>
    <linearGradient id="name" x1="0" y1="0" x2="1" y2="0" gradientUnits="objectBoundingBox">
      <stop offset="0" stop-color="#22D3EE"/>
      <stop offset="0.35" stop-color="#F8FAFC"/>
      <stop offset="0.65" stop-color="#A78BFA"/>
      <stop offset="1" stop-color="#22D3EE"/>
      <animateTransform attributeName="gradientTransform" type="translate" values="-1 0;1 0" dur="6s" repeatCount="indefinite"/>
    </linearGradient>
    <linearGradient id="edge" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#22D3EE" stop-opacity=".7"/>
      <stop offset=".5" stop-color="#8B5CF6" stop-opacity=".25"/>
      <stop offset="1" stop-color="#22C55E" stop-opacity=".7"/>
    </linearGradient>
    <linearGradient id="scan" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#22D3EE" stop-opacity="0"/>
      <stop offset=".5" stop-color="#22D3EE" stop-opacity=".10"/>
      <stop offset="1" stop-color="#22D3EE" stop-opacity="0"/>
    </linearGradient>
  </defs>
  <style>
    .mono { font-family: ui-monospace, 'SF Mono', 'Cascadia Code', Consolas, 'Liberation Mono', monospace; }
    .sans { font-family: 'Segoe UI', -apple-system, BlinkMacSystemFont, Inter, Helvetica, Arial, sans-serif; }
    .b1 { animation: drift1 16s ease-in-out infinite alternate; }
    .b2 { animation: drift2 19s ease-in-out infinite alternate; }
    .b3 { animation: drift3 23s ease-in-out infinite alternate; }
    @keyframes drift1 { to { transform: translate(260px, 60px) scale(1.2); } }
    @keyframes drift2 { to { transform: translate(-300px, -40px) scale(.85); } }
    @keyframes drift3 { to { transform: translate(-160px, 70px) scale(1.15); } }
    .scan { animation: scan 7s linear infinite; }
    @keyframes scan { from { transform: translateY(-120px); } to { transform: translateY(400px); } }
    .pulse { animation: pulse 1.8s ease-in-out infinite; transform-origin: 72px 64px; }
    @keyframes pulse { 50% { opacity: .35; transform: scale(1.8); } }
    .rise { opacity: 0; animation: rise .9s cubic-bezier(.2,.8,.2,1) forwards; }
    .d1 { animation-delay: .1s; } .d2 { animation-delay: .35s; } .d3 { animation-delay: .6s; }
    @keyframes rise { from { opacity: 0; transform: translateY(18px); } to { opacity: 1; transform: none; } }
    .role { opacity: 0; animation: role 16s infinite; }
    .r2 { animation-delay: 4s; } .r3 { animation-delay: 8s; } .r4 { animation-delay: 12s; }
    @keyframes role {
      0% { opacity: 0; transform: translateY(16px); }
      3%, 22% { opacity: 1; transform: none; }
      25%, 100% { opacity: 0; transform: translateY(-16px); }
    }
    .caret { animation: blink 1s steps(1) infinite; }
    @keyframes blink { 50% { opacity: 0; } }
    @media (prefers-reduced-motion: reduce) {
      * { animation: none !important; }
      .rise, .r1 { opacity: 1; }
    }
  </style>

  <g clip-path="url(#card)">
    <rect width="1200" height="360" fill="#070B14"/>
    <circle class="b1" cx="180" cy="80" r="190" fill="#22D3EE" opacity=".30" filter="url(#blur)"/>
    <circle class="b2" cx="1040" cy="300" r="210" fill="#8B5CF6" opacity=".38" filter="url(#blur)"/>
    <circle class="b3" cx="760" cy="40" r="150" fill="#22C55E" opacity=".18" filter="url(#blur)"/>
    <rect width="1200" height="360" fill="url(#dots)" opacity=".10"/>
    <rect class="scan" width="1200" height="120" fill="url(#scan)"/>

    <g class="rise d1">
      <circle class="pulse" cx="72" cy="64" r="5" fill="#22C55E"/>
      <circle cx="72" cy="64" r="5" fill="#22C55E"/>
      <text x="88" y="70" class="mono" font-size="17" fill="#94A3B8" letter-spacing="1">ONLINE · BUILDING WITH AI</text>
    </g>

    <text x="64" y="186" class="sans rise d2" font-size="96" font-weight="800" letter-spacing="-2" fill="url(#name)" filter="url(#glow)">Brazil Singh</text>

    <g class="mono" font-size="30" fill="#E2E8F0">
      <text x="64" y="262" fill="#22D3EE" class="rise d3">&gt;</text>
      <text x="96" y="262" class="role r1">AI agents &amp; MCP servers</text>
      <text x="96" y="262" class="role r2">prompt &amp; skill engineering</text>
      <text x="96" y="262" class="role r3">automation that ships itself</text>
      <text x="96" y="262" class="role r4">code · marketing · growth</text>
    </g>

    <g class="rise d3 mono" font-size="15" fill="#64748B" letter-spacing="2">
      <text x="64" y="318">AGENTS  /  MCP  /  PROMPTS  /  SKILLS  /  AUTOMATION</text>
    </g>
  </g>
  <rect x="1" y="1" width="1198" height="358" rx="21" fill="none" stroke="url(#edge)" stroke-width="2"/>
</svg>
